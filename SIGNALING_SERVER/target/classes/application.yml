server:
  port: 8080

signaling:
  max-payload-bytes: 65536
  auth:
    enabled: false
    jwt-secret: change-me
  redis:
    enabled: false
    channel-prefix: signaling.room.
  websocket:
    path: /ws
    allowed-origins: ["*"]
    allow-sock-js: false

spring:
  data:
    redis:
      repositories:
        enabled: false
  redis:
    host: localhost
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
