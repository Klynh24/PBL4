<!DOCTYPE html>
<html>
  <head>
    <title>WebRTC Signaling Test</title>
  </head>
  <body>
    <h1>WebRTC Signaling Client</h1>
    <div>
      <label>User ID: <input type="text" id="userId" value="user1" /></label
      ><br />
      <label>Room ID: <input type="text" id="roomId" value="room1" /></label
      ><br />
      <button onclick="connect()">Connect</button>
      <button onclick="disconnect()">Disconnect</button>
    </div>
    <div>
      <h3>Status: <span id="status">Disconnected</span></h3>
      <h3>Messages:</h3>
      <pre id="messages"></pre>
    </div>

    <script>
      let ws = null;

      function connect() {
        const userId = document.getElementById("userId").value;
        const roomId = document.getElementById("roomId").value;

        // 🔥 QUAN TRỌNG: Dùng đúng port server đang chạy
        const wsUrl = `ws://localhost:8082/ws?userId=${userId}&room=${roomId}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          document.getElementById("status").textContent = "Connected";
          addMessage("Connected to " + wsUrl);
        };

        ws.onmessage = (event) => {
          addMessage("Received: " + event.data);
        };

        ws.onerror = (error) => {
          addMessage("Error: " + error);
        };

        ws.onclose = () => {
          document.getElementById("status").textContent = "Disconnected";
          addMessage("Disconnected");
        };
      }

      function disconnect() {
        if (ws) {
          ws.close();
          ws = null;
        }
      }

      function addMessage(msg) {
        const messages = document.getElementById("messages");
        messages.textContent +=
          new Date().toLocaleTimeString() + " - " + msg + "\n";
      }
    </script>
  </body>
</html>
