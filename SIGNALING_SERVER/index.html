<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC LAN Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: #667eea;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
      }

      .controls {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
        transition: border-color 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
      }

      .button-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        flex: 1;
        min-width: 150px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-success {
        background: #51cf66;
        color: white;
      }

      .btn-success:hover:not(:disabled) {
        background: #40c057;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(81, 207, 102, 0.4);
      }

      .btn-danger {
        background: #ff6b6b;
        color: white;
      }

      .btn-danger:hover:not(:disabled) {
        background: #ee5a52;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
      }

      #status {
        padding: 15px;
        margin: 20px 0;
        border-radius: 6px;
        font-family: "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .status-success {
        background: #d3f9d8;
        border-left: 4px solid #51cf66;
        color: #2b8a3e;
      }

      .status-warning {
        background: #fff3bf;
        border-left: 4px solid #ffd43b;
        color: #e67700;
      }

      .status-error {
        background: #ffe3e3;
        border-left: 4px solid #ff6b6b;
        color: #c92a2a;
      }

      .videos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .video-container {
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
      }

      .video-container h3 {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 15px;
        border-radius: 4px;
        font-size: 14px;
        z-index: 10;
      }

      video {
        width: 100%;
        display: block;
        aspect-ratio: 4/3;
        object-fit: cover;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .stat-card {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 6px;
        text-align: center;
      }

      .stat-value {
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
      }

      .stat-label {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎥 WebRTC Video Conference</h1>

      <div class="controls">
        <div class="form-group">
          <label>👤 User ID</label>
          <input type="text" id="userId" placeholder="Your name" />
        </div>

        <div class="form-group">
          <label>🏠 Room ID</label>
          <input
            type="text"
            id="roomId"
            value="room001"
            placeholder="Room to join"
          />
        </div>

        <div class="button-group">
          <button id="connectBtn" class="btn-primary" onclick="connect()">
            🔌 Connect
          </button>
          <button
            id="cameraBtn"
            class="btn-success"
            onclick="startCamera()"
            disabled
          >
            📹 Start Camera
          </button>
          <button
            id="disconnectBtn"
            class="btn-danger"
            onclick="disconnect()"
            disabled
          >
            ⏹️ Disconnect
          </button>
        </div>
      </div>

      <div id="status" class="status-success">
        📊 Ready to connect. Enter your name and room ID, then click Connect.
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="statConnections">0</div>
          <div class="stat-label">Connections</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statBitrate">0</div>
          <div class="stat-label">Bitrate (kbps)</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statPackets">0</div>
          <div class="stat-label">Packets</div>
        </div>
      </div>

      <div class="videos">
        <div class="video-container">
          <h3>📹 You</h3>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div id="remoteVideos"></div>
      </div>
    </div>

    <script>
      let ws = null;
      let localStream = null;
      const peerConnections = new Map();

      // Auto-generate user ID
      window.onload = () => {
        const userId = "user-" + Math.random().toString(36).substr(2, 9);
        document.getElementById("userId").value = userId;
      };

      function log(message, type = "success") {
        const status = document.getElementById("status");
        const timestamp = new Date().toLocaleTimeString();
        status.className = `status-${type}`;
        status.textContent = `[${timestamp}] ${message}`;
        console.log(`[${type.toUpperCase()}]`, message);
      }

      function updateStats() {
        document.getElementById("statConnections").textContent =
          peerConnections.size;
      }

      async function connect() {
        const userId = document.getElementById("userId").value.trim();
        const roomId = document.getElementById("roomId").value.trim();

        if (!userId || !roomId) {
          log("❌ Please enter User ID and Room ID", "error");
          return;
        }

        const wsUrl = `ws://${window.location.host}/ws?userId=${userId}&room=${roomId}`;
        log(`🔌 Connecting to ${wsUrl}...`, "warning");

        try {
          ws = new WebSocket(wsUrl);

          ws.onopen = () => {
            log(`✅ Connected! User: ${userId} | Room: ${roomId}`, "success");
            document.getElementById("connectBtn").disabled = true;
            document.getElementById("cameraBtn").disabled = false;
            document.getElementById("disconnectBtn").disabled = false;
          };

          ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            console.log("📨 Received:", message);
            await handleSignalingMessage(message);
          };

          ws.onerror = (error) => {
            log(`❌ WebSocket error: ${error}`, "error");
          };

          ws.onclose = () => {
            log("🔌 Disconnected from server", "warning");
            resetUI();
          };
        } catch (error) {
          log(`❌ Connection failed: ${error.message}`, "error");
        }
      }

      async function startCamera() {
        try {
          log("📹 Starting camera...", "warning");

          localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
            audio: true,
          });

          document.getElementById("localVideo").srcObject = localStream;
          log("✅ Camera started!", "success");
        } catch (error) {
          log(`❌ Camera error: ${error.message}`, "error");
        }
      }

      async function handleSignalingMessage(message) {
        switch (message.type) {
          case "user-joined":
            log(`👋 ${message.userId} joined`, "success");
            break;
          case "user-left":
            log(`👋 ${message.userId} left`, "warning");
            removeRemoteVideo(message.userId);
            break;
          case "offer":
          case "answer":
          case "ice-candidate":
            // Handle WebRTC signaling here
            break;
        }
        updateStats();
      }

      function removeRemoteVideo(userId) {
        const videoElement = document.getElementById(`remote-${userId}`);
        if (videoElement) {
          videoElement.remove();
        }
        if (peerConnections.has(userId)) {
          peerConnections.get(userId).close();
          peerConnections.delete(userId);
        }
        updateStats();
      }

      function disconnect() {
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }

        peerConnections.forEach((pc) => pc.close());
        peerConnections.clear();

        if (ws) {
          ws.close();
          ws = null;
        }

        document.getElementById("localVideo").srcObject = null;
        document.getElementById("remoteVideos").innerHTML = "";

        log("⏹️ Disconnected", "warning");
        resetUI();
      }

      function resetUI() {
        document.getElementById("connectBtn").disabled = false;
        document.getElementById("cameraBtn").disabled = true;
        document.getElementById("disconnectBtn").disabled = true;
        updateStats();
      }

      // Cleanup on page unload
      window.addEventListener("beforeunload", disconnect);
    </script>
  </body>
</html>
