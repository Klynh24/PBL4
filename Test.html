<!DOCTYPE html>
<html>
  <head>
    <title>WebRTC SFU Test (Connect First)</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      video {
        background: #333;
        width: 48%;
        max-width: 400px;
        margin: 5px;
      }
      #roomControls {
        display: none;
      } /* Ẩn cho đến khi kết nối */
      #status {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>SFU Test Page (Connect First Flow)</h2>

    <div>
      <button id="connectButton">1. Connect to Server</button>
      <span id="status">Status: Disconnected</span>
    </div>

    <div id="roomControls">
      <hr />
      <label>Room:</label>
      <input id="room" type="text" value="test-room" />
      <button id="joinButton">2. Join Room</button>
    </div>

    <div id="videoControls" style="display: none">
      <hr />
      <h3>Local Video</h3>
      <video id="localVideo" autoplay muted playsinline></video>
      <h3>Remote Video</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script>
      const connectButton = document.getElementById("connectButton");
      const joinButton = document.getElementById("joinButton");
      const roomInput = document.getElementById("room");
      const statusLabel = document.getElementById("status");
      const roomControls = document.getElementById("roomControls");
      const videoControls = document.getElementById("videoControls");

      const localVideo = document.getElementById("localVideo");
      const remoteVideo = document.getElementById("remoteVideo");

      let ws = null;
      let pc = null;
      const userId = "user-" + Math.random().toString(36).substr(2, 9);

      // === BƯỚC 1: KẾT NỐI ===
      connectButton.onclick = () => {
        if (ws) return; // Đã kết nối

        connectButton.disabled = true;
        statusLabel.innerText = "Status: Connecting...";

        ws = new WebSocket(`ws://localhost:8082/ws`);

        // 1a. KẾT NỐI THÀNH CÔNG
        ws.onopen = () => {
          console.log("WS Connected!");
          statusLabel.innerText = "Status: Connected!";
          statusLabel.style.color = "green";
          connectButton.innerText = "Connected";

          // Hiển thị nút "Join Room"
          roomControls.style.display = "block";

          // Bắt đầu lắng nghe tin nhắn từ server
          setupWebSocketMessageHandler();
        };

        // 1b. KẾT NỐI THẤT BẠI / MẤT KẾT NỐI
        ws.onclose = () => {
          console.log("WS Closed.");
          statusLabel.innerText = "Status: Disconnected";
          statusLabel.style.color = "red";
          connectButton.disabled = false;
          connectButton.innerText = "1. Connect to Server";

          // Ẩn các nút điều khiển
          roomControls.style.display = "none";
          videoControls.style.display = "none";

          if (pc) pc.close();
          pc = null;
          ws = null;
        };

        // 1c. LỖI KẾT NỐI
        ws.onerror = (err) => {
          console.error("WS Error:", err);
          statusLabel.innerText = "Status: Connection Failed";
          statusLabel.style.color = "red";
          connectButton.disabled = false;
        };
      };

      // === BƯỚC 2: VÀO PHÒNG ===
      joinButton.onclick = () => {
        joinButton.disabled = true;
        joinButton.innerText = "Joining...";

        const joinMsg = {
          type: "join",
          room: roomInput.value,
          userId: userId,
        };
        console.log("WS Send (join):", joinMsg);
        ws.send(JSON.stringify(joinMsg));
      };

      // Hàm này xử lý tất cả các tin nhắn server
      function setupWebSocketMessageHandler() {
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          console.log("WS Recv:", msg);

          switch (msg.type) {
            // 2a. Server xác nhận "joined" -> BẮT ĐẦU WebRTC
            case "joined":
              console.log("Successfully joined room!", msg.peers);
              joinButton.innerText = "Joined!";
              videoControls.style.display = "block"; // Hiển thị video
              startWebRTCConnection();
              break;

            case "answer":
              if (pc) {
                console.log("Setting remote answer");
                pc.setRemoteDescription(new RTCSessionDescription(msg));
              }
              break;

            case "peer-joined":
              console.log("New peer joined:", msg.userId);
              break;

            case "error":
              console.error("Server error:", msg.message);
              alert("Error: " + msg.message);
              joinButton.disabled = false;
              joinButton.innerText = "2. Join Room";
              break;
          }
        };
      }

      // === BƯỚC 3: BẮT ĐẦU WEBRTC ===
      // (Hàm này chỉ được gọi sau khi đã "join" thành công)
      async function startWebRTCConnection() {
        const iceServers = [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ];

        pc = new RTCPeerConnection({ iceServers: iceServers });

        pc.ontrack = (event) => {
          console.log("ONTRACK! Got remote stream.");
          remoteVideo.srcObject = event.streams[0];
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            const candidateMsg = {
              type: "candidate",
              candidate: JSON.stringify(event.candidate.toJSON()),
            };
            console.log("WS Send (candidate):", candidateMsg);
            ws.send(JSON.stringify(candidateMsg));
          }
        };

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });
          localVideo.srcObject = stream;
          stream.getTracks().forEach((track) => {
            pc.addTrack(track, stream);
          });
        } catch (err) {
          console.error("Error getting media:", err);
          return;
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const offerMsg = {
          type: "offer",
          sdp: offer.sdp,
        };
        console.log("WS Send (offer):", offerMsg);
        ws.send(JSON.stringify(offerMsg));
      }
    </script>
  </body>
</html>
