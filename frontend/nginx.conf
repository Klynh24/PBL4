server {
    listen 80;

    # Phục vụ Frontend tĩnh
    root /usr/share/nginx/html;
    index index.html;

    # 1. Xử lý CORS Preflight (OPTIONS requests)
    location /api/v1/ {
        # Nếu phương thức là OPTIONS, trả về 204 No Content và headers CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
            # Trả về phản hồi ngay lập tức, không proxy
            return 204;
        }

        # 2. Proxy request API thông thường (GET, POST, v.v.)
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Định tuyến Frontend (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}