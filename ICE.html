<!doctype html>
<meta charset="utf-8" />
<title>STUN + Signaling (ICE only) Demo</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    margin: 16px;
  }
  .row {
    margin: 6px 0;
  }
  input[type="text"] {
    width: 360px;
  }
  pre {
    background: #111;
    color: #eee;
    padding: 10px;
    height: 320px;
    overflow: auto;
    white-space: pre-wrap;
  }
  video {
    width: 280px;
    background: #000;
    margin-right: 8px;
  }
  button {
    margin-right: 6px;
  }
  .label {
    display: inline-block;
    width: 160px;
  }
</style>

<h2>STUN + Signaling (ICE) Demo</h2>

<div class="row">
  <span class="label">Signaling WS URL:</span>
  <input id="wsUrl" type="text" value="wss://toan-webrtc.ddns.net/ws" />
</div>
<div class="row">
  <span class="label">JWT token (optional):</span>
  <input id="token" type="text" placeholder="eyJhbGciOi..." />
</div>
<div class="row">
  <span class="label">Room ID:</span>
  <input id="roomId" type="text" value="room-42" />
</div>
<div class="row">
  <span class="label">Your subject (clientId):</span>
  <input id="selfId" type="text" value="peer-a" />
</div>
<div class="row">
  <span class="label">Target subject:</span>
  <input id="targetId" type="text" value="peer-b" />
</div>
<div class="row">
  <span class="label">STUN URL:</span>
  <input id="stunUrl" type="text" value="stun:18.143.99.235:3478" />
</div>
<div class="row">
  <label
    ><input id="useMedia" type="checkbox" /> Use camera/mic (HTTPS hoặc
    localhost)</label
  >
</div>
<div class="row">
  <button id="connectBtn">Connect</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
  <button id="callBtn" disabled>Start Offer (A bấm)</button>
  <button id="leaveBtn" disabled>Leave</button>
  <span id="status" style="margin-left: 12px; font-weight: 600; color: #b00"
    >Disconnected</span
  >
</div>

<div class="row">
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<pre id="log"></pre>

<script>
  // ===== Helpers UI =====
  const $ = (id) => document.getElementById(id);
  const log = (...a) => {
    const L = $("log");
    L.textContent +=
      a.map((x) => (typeof x === "string" ? x : JSON.stringify(x))).join(" ") +
      "\n";
    L.scrollTop = L.scrollHeight;
  };
  const setConn = (ok) => {
    $("connectBtn").disabled = !!ok;
    $("disconnectBtn").disabled = !ok;
    $("callBtn").disabled = !ok;
    $("leaveBtn").disabled = !ok;
    $("status").textContent = ok ? "Connected" : "Disconnected";
    $("status").style.color = ok ? "#2e7d32" : "#b00";
  };

  // ===== Globals =====
  let ws = null;
  let pc = null;
  let pending = [];
  let localStream = null;

  // ===== Signaling helpers =====
  function buildWsUrl() {
    const base = $("wsUrl").value.trim();
    const token = $("token").value.trim();
    const clientId = $("selfId").value.trim();
    const q = new URLSearchParams();
    if (token) q.set("token", token);
    if (clientId) q.set("clientId", clientId);
    return base + (base.includes("?") ? "&" : "?") + q.toString();
  }
  function sendSignal(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN)
      return log("[SIG] not connected");
    try {
      const s = JSON.stringify(obj);
      ws.send(s);
      log("⬆", s);
    } catch (e) {
      log("[SIG] send err:", e.message);
    }
  }

  // ===== ICE (STUN only) =====
  function rtcConfig() {
    const stunUrl = $("stunUrl").value.trim();
    // iceServers PHẢI là mảng các RTCIceServer
    const STUNS = stunUrl ? [{ urls: stunUrl }] : [];
    return {
      iceServers: STUNS, // CHỈ STUN
      iceTransportPolicy: "all", // cho phép host + srflx
      bundlePolicy: "max-bundle",
      rtcpMuxPolicy: "require",
      iceCandidatePoolSize: 2,
    };
  }

  function ensurePc() {
    if (pc) return pc;
    pc = new RTCPeerConnection(rtcConfig());

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        log("[ICE] local cand:", e.candidate.candidate);
        sendSignal({
          type: "candidate",
          roomId: $("roomId").value.trim(),
          target: $("targetId").value.trim(),
          candidate: e.candidate,
        });
      } else {
        log("[ICE] gathering complete");
      }
    };

    pc.onicecandidateerror = (e) => {
      log("[ICE] cand error:", e.errorText || e.errorCode || "");
    };

    pc.onicegatheringstatechange = () =>
      log("[ICE] gathering =", pc.iceGatheringState);

    pc.oniceconnectionstatechange = () => {
      log("[ICE] state =", pc.iceConnectionState);
      if (
        pc.iceConnectionState === "connected" ||
        pc.iceConnectionState === "completed"
      ) {
        logSelectedPair();
      }
      if (pc.iceConnectionState === "failed") {
        iceRestart();
      }
    };

    // Media tracks (optional)
    pc.ontrack = (ev) => {
      const [stream] = ev.streams;
      $("remoteVideo").srcObject = stream;
    };

    // DataChannel demo (bạn có thể bỏ nếu chỉ test media)
    pc.createDataChannel("ctrl").onopen = () => log("[DC] open");

    return pc;
  }

  async function maybeAddLocalMedia() {
    if (!$("useMedia").checked) return;
    if (localStream) return;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: true,
      });
      $("localVideo").srcObject = localStream;
      ensurePc();
      localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    } catch (e) {
      log("[MEDIA] getUserMedia error:", e.message);
    }
  }

  async function startOffer() {
    await maybeAddLocalMedia();
    ensurePc();
    const offer = await pc.createOffer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: true,
    });
    await pc.setLocalDescription(offer);
    sendSignal({
      type: "offer",
      roomId: $("roomId").value.trim(),
      target: $("targetId").value.trim(),
      sdp: offer.sdp,
    });
    log("[SIG] sent offer");
  }

  async function onOffer(sdp) {
    await maybeAddLocalMedia();
    ensurePc();
    await pc.setRemoteDescription({ type: "offer", sdp });
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    sendSignal({
      type: "answer",
      roomId: $("roomId").value.trim(),
      target: $("targetId").value.trim(),
      sdp: ans.sdp,
    });
    log("[SIG] sent answer");

    // add candidates đến sớm
    while (pending.length) {
      try {
        await pc.addIceCandidate(pending.shift());
      } catch (e) {
        log("[ICE] add cand err", e.message);
      }
    }
  }

  async function onAnswer(sdp) {
    await pc.setRemoteDescription({ type: "answer", sdp });
    while (pending.length) {
      try {
        await pc.addIceCandidate(pending.shift());
      } catch (e) {
        log("[ICE] add cand err", e.message);
      }
    }
  }

  async function onRemoteCandidate(c) {
    if (!pc || !pc.remoteDescription) {
      pending.push(c);
      return;
    }
    try {
      await pc.addIceCandidate(c);
    } catch (e) {
      log("[ICE] add cand err", e.message);
    }
  }

  async function iceRestart() {
    if (!pc || pc.signalingState !== "stable") return;
    log("[ICE] Restart");
    const offer = await pc.createOffer({ iceRestart: true });
    await pc.setLocalDescription(offer);
    sendSignal({
      type: "offer",
      roomId: $("roomId").value.trim(),
      target: $("targetId").value.trim(),
      sdp: offer.sdp,
    });
  }

  async function logSelectedPair() {
    const stats = await pc.getStats(null);
    stats.forEach((r) => {
      if (r.type === "transport" && r.selectedCandidatePairId) {
        const pair = stats.get(r.selectedCandidatePairId);
        const L = stats.get(pair.localCandidateId);
        const R = stats.get(pair.remoteCandidateId);
        log(
          "[ICE] SELECTED:",
          L?.candidateType,
          L?.address || L?.ip,
          "→",
          R?.candidateType,
          R?.address || R?.ip,
          "proto=",
          pair.protocol,
          "rtt=",
          pair.currentRoundTripTime
        );
      }
    });
  }

  // ===== WebSocket wiring =====
  $("connectBtn").onclick = () => {
    if (ws && ws.readyState === WebSocket.OPEN)
      return log("[SIG] already connected");
    const url = buildWsUrl();
    log("[SIG] connecting:", url);
    try {
      ws = new WebSocket(url);
    } catch (e) {
      return log("[SIG] create WS err:", e.message);
    }

    ws.onopen = () => {
      setConn(true);
      log("[SIG] WS opened");
      // JOIN theo backend: dùng roomId
      sendSignal({ type: "join", roomId: $("roomId").value.trim() });
    };
    ws.onclose = (e) => {
      setConn(false);
      log("[SIG] WS closed", `code=${e.code}`, `reason=${e.reason || "n/a"}`);
      ws = null;
    };
    ws.onerror = () => log("[SIG] WS error");
    ws.onmessage = async (ev) => {
      let m;
      try {
        m = JSON.parse(ev.data);
      } catch {
        return log("⬇", ev.data);
      }
      log("⬇", m);

      // Lifecycle từ server của bạn
      if (m.type === "joined")
        return log("[SIG] joined room", m.roomId, "as", m.subject);
      if (m.type === "peer-joined")
        return log("[SIG] peer-joined:", m.subject ?? "(unknown)");
      if (m.type === "peer-left")
        return log(
          "[SIG] peer-left:",
          m.subject ?? "(unknown)",
          m.reason ? `reason=${m.reason}` : ""
        );

      // RAW signaling
      if (m.type === "offer" && m.sdp) return onOffer(m.sdp);
      if (m.type === "answer" && m.sdp) return onAnswer(m.sdp);
      if (m.type === "candidate" && m.candidate)
        return onRemoteCandidate(m.candidate);
    };
  };

  function hardReset() {
    try {
      pc?.getSenders().forEach((s) => s.track?.stop());
    } catch {}
    try {
      pc?.close();
    } catch {}
    pc = null;
    pending.length = 0;
    document.getElementById("localVideo").srcObject = null;
    document.getElementById("remoteVideo").srcObject = null;
  }

  $("disconnectBtn").onclick = () => {
    hardReset();
    if (ws) {
      ws.close(1000, "Client requested");
      ws = null;
    }
    setConn(false);
  };

  $("callBtn").onclick = startOffer;

  $("leaveBtn").onclick = () => {
    sendSignal({ type: "leave" });
  };
</script>
